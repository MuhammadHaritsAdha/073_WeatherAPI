<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation MapTiler</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        .card h3 {
            margin: 5px 0;
            color: #333333;
            font-size: 16px;
        }

        .identity {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eef0f4;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #007bff;
        }

        button {
            padding: 10px 16px;
            background-color: #eb1818;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #d80707;
        }

        .result-box {
            background-color: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .result-box p {
            margin: 10px 0;
            font-size: 14px;
            color: #444;
            display: flex;
            justify-content: space-between;
        }

        .result-box span {
            font-weight: bold;
            color: #111;
        }
    </style>
    
</head>
<body>

    <div class="card">
        <div class="identity">
            <h3>Nama : Muhammad Harits Adha</h3>
            <h3>NIM  : 20240140073</h3>
        </div>

        <div class="search-box">
            <label for="inputLokasi">Cari Lokasi:</label>
            <div class="input-group">
                <input type="text" id="inputLokasi" value="Jakarta" placeholder="Masukkan nama kota...">
                <button onclick="cariLokasi()">Cari</button>
            </div>
        </div>

        <div class="result-box">
            <p>Negara : <span id="negara">-</span></p>
            <p>Provinsi : <span id="provinsi">-</span></p>
            <p>Kecamatan : <span id="kecamatan">-</span></p>
            <p>Longitude : <span id="longitude">-</span></p>
            <p>Latitude : <span id="latitude">-</span></p>
        </div>
    </div>

    <script>
        function cariLokasi() {
            const lokasi = document.getElementById("inputLokasi").value;

            fetch(`/api/lokasi?kota=${lokasi}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("negara").innerText = data.negara;
                    document.getElementById("provinsi").innerText = data.provinsi;
                    document.getElementById("kecamatan").innerText = data.kecamatan;
                    document.getElementById("longitude").innerText = data.longitude;
                    document.getElementById("latitude").innerText = data.latitude;
                })
                .catch(error => {
                    console.error("Error:", error);
                });
        }

        cariLokasi();
    </script>
</body>
</html>
